<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Câu hỏi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Thư viện hỗ trợ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f4f6f9; }
        .table-input { width: 100%; border: 1px solid #dee2e6; padding: 5px; border-radius: 4px; }
        .table-input:focus { border-color: #0d6efd; outline: none; }
        .nav-tabs .nav-link { font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4 text-center">Hệ thống Quản trị Ngân hàng Câu hỏi</h2>
    
    <!-- Tab Điều hướng -->
    <ul class="nav nav-tabs" id="mainTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#bank" type="button">Ngân hàng câu hỏi</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#import" type="button">Nhập từ Word</button>
        </li>
    </ul>

    <div class="tab-content bg-white p-4 border border-top-0 rounded-bottom">
        
        <!-- Tab 1: Ngân hàng câu hỏi -->
        <div class="tab-pane fade show active" id="bank">
            <h4>Danh sách câu hỏi hiện có</h4>
            <p class="text-muted">Tính năng quản lý danh sách câu hỏi của bạn sẽ nằm ở đây...</p>
            <!-- Dán bảng dữ liệu cũ của bạn vào đây -->
        </div>

        <!-- Tab 2: Nhập từ Word -->
        <div class="tab-pane fade" id="import">
            <h4>Nhập câu hỏi từ File Word (.docx)</h4>
            <div class="mb-3">
                <label class="form-label">Tải file Word lên:</label>
                <input type="file" id="wordFile" class="form-control" accept=".docx">
            </div>

            <div id="editorSection" style="display: none;">
                <div class="alert alert-warning">Vui lòng rà soát nội dung trước khi kết chuyển.</div>
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead class="table-dark">
                            <tr>
                                <th>Câu hỏi</th><th>A</th><th>B</th><th>C</th><th>D</th><th style="width: 8%;">Đ.Án</th><th>Xóa</th>
                            </tr>
                        </thead>
                        <tbody id="questionTableBody"></tbody>
                    </table>
                </div>
                <button class="btn btn-success btn-lg w-100" onclick="saveToBank()">Kết chuyển vào hệ thống</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- XỬ LÝ ĐỌC FILE WORD ---
    document.getElementById('wordFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(loadEvent) {
            mammoth.extractRawText({ arrayBuffer: loadEvent.target.result })
                .then(res => {
                    const data = parseWordText(res.value);
                    renderImportTable(data);
                    document.getElementById('editorSection').style.display = 'block';
                })
                .catch(err => alert("Lỗi đọc file: " + err));
        };
        reader.readAsArrayBuffer(file);
    });

    // --- LOGIC BÓC TÁCH VĂN BẢN (REGEX) ---
    function parseWordText(text) {
        // Tách khối theo từ khóa "Câu 1", "Câu 2"...
        const blocks = text.split(/(?=Câu\s*\d+[:\.]?)/gi);
        let results = [];
        blocks.forEach(block => {
            if (block.trim().length < 15) return;
            
            const q = block.replace(/Câu\s*\d+[:\.]?/i, "").split(/A[\.\)]/i)[0] || "";
            const a = block.match(/A[\.\)]\s*(.*?)(?=B[\.\)])/is);
            const b = block.match(/B[\.\)]\s*(.*?)(?=C[\.\)])/is);
            const c = block.match(/C[\.\)]\s*(.*?)(?=D[\.\)])/is);
            const d = block.match(/D[\.\)]\s*(.*?)(?=\n|$)/is);

            results.push({
                q: q.trim(),
                a: a ? a[1].trim() : "",
                b: b ? b[1].trim() : "",
                c: c ? c[1].trim() : "",
                d: d ? d[1].trim() : "",
                ans: ""
            });
        });
        return results;
    }

    // --- HIỂN THỊ DỮ LIỆU ĐỂ SỬA ---
    function renderImportTable(data) {
        const tbody = document.getElementById('questionTableBody');
        tbody.innerHTML = '';
        data.forEach(item => {
            tbody.insertAdjacentHTML('beforeend', `
                <tr>
                    <td><input class="table-input" value="${item.q}"></td>
                    <td><input class="table-input" value="${item.a}"></td>
                    <td><input class="table-input" value="${item.b}"></td>
                    <td><input class="table-input" value="${item.c}"></td>
                    <td><input class="table-input" value="${item.d}"></td>
                    <td><input class="table-input" value="${item.ans}" placeholder="A/B/C/D"></td>
                    <td><button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">X</button></td>
                </tr>
            `);
        });
    }

    // --- HÀM KẾT CHUYỂN DỮ LIỆU ---
    function saveToBank() {
        const rows = document.querySelectorAll('#questionTableBody tr');
        const data = Array.from(rows).map(row => {
            const inputs = row.querySelectorAll('input');
            return {
                question: inputs[0].value,
                a: inputs[1].value,
                b: inputs[2].value,
                c: inputs[3].value,
                d: inputs[4].value,
                correct_answer: inputs[0].value.toUpperCase()
            };
        });

        // TODO: DÁN CODE KẾT NỐI DATABASE (SUPABASE/FIREBASE) CỦA BẠN VÀO ĐÂY
        // Ví dụ: 
        // const { data, error } = await supabase.from('questions').insert(data);
        
        console.log("Dữ liệu đã sẵn sàng để lưu:", data);
        alert("Đã kết chuyển " + data.length + " câu hỏi thành công!");
    }
</script>
</body>
</html>
