<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhập ngân hàng câu hỏi từ Word</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        .table-input { width: 100%; border: none; background: transparent; padding: 5px; }
        .table-input:focus { background: #e8f0fe; outline: none; border-radius: 4px; }
        .hidden { display: none; }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-4">Bộ chuyển đổi Word sang Excel/Database</h2>
        <div class="mb-4">
            <label class="form-label"><strong>Chọn file Word (.docx) của bạn:</strong></label>
            <input type="file" id="wordFile" class="form-control" accept=".docx">
        </div>
        
        <div id="editorSection" class="hidden">
            <div class="alert alert-info">
                <strong>Hướng dẫn:</strong> Kiểm tra và sửa lỗi nếu cần. Nhấn "Kết chuyển" khi đã xong.
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="qTable">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 30%;">Câu hỏi</th>
                            <th>A</th><th>B</th><th>C</th><th>D</th>
                            <th style="width: 8%;">Đáp án</th>
                            <th style="width: 5%;">Xóa</th>
                        </tr>
                    </thead>
                    <tbody id="questionTableBody"></tbody>
                </table>
            </div>
            <button class="btn btn-primary btn-lg w-100" onclick="saveToBank()">Kết chuyển vào Ngân hàng câu hỏi</button>
        </div>
    </div>
</div>

<script>
    // 1. Đọc file
    document.getElementById('wordFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(loadEvent) {
            mammoth.extractRawText({ arrayBuffer: loadEvent.target.result })
                .then(res => {
                    const questions = parseText(res.value);
                    renderTable(questions);
                    document.getElementById('editorSection').classList.remove('hidden');
                })
                .catch(err => alert("Lỗi đọc file: " + err));
        };
        reader.readAsArrayBuffer(file);
    });

    // 2. Logic bóc tách (Regex)
    function parseText(text) {
        // Tách câu dựa trên từ khóa "Câu 1", "Câu 2"...
        const blocks = text.split(/(?=Câu\s*\d+[:\.]?)/gi);
        let results = [];
        blocks.forEach(block => {
            if (block.trim().length < 20) return; // Bỏ qua nếu quá ngắn
            
            const q = block.replace(/Câu\s*\d+[:\.]?/i, "").split(/A[\.\)]/i)[0] || "";
            const a = block.match(/A[\.\)]\s*(.*?)(?=B[\.\)])/i);
            const b = block.match(/B[\.\)]\s*(.*?)(?=C[\.\)])/i);
            const c = block.match(/C[\.\)]\s*(.*?)(?=D[\.\)])/i);
            const d = block.match(/D[\.\)]\s*(.*?)(?=\n|$)/i);

            results.push({
                q: q.trim(),
                a: a ? a[1].trim() : "",
                b: b ? b[1].trim() : "",
                c: c ? c[1].trim() : "",
                d: d ? d[1].trim() : "",
                ans: ""
            });
        });
        return results;
    }

    // 3. Render giao diện sửa
    function renderTable(data) {
        const tbody = document.getElementById('questionTableBody');
        tbody.innerHTML = '';
        data.forEach(item => {
            tbody.insertAdjacentHTML('beforeend', `
                <tr>
                    <td><input class="table-input" value="${item.q}"></td>
                    <td><input class="table-input" value="${item.a}"></td>
                    <td><input class="table-input" value="${item.b}"></td>
                    <td><input class="table-input" value="${item.c}"></td>
                    <td><input class="table-input" value="${item.d}"></td>
                    <td><input class="table-input text-uppercase" value="${item.ans}" placeholder="A/B/C/D"></td>
                    <td><button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">X</button></td>
                </tr>
            `);
        });
    }

    // 4. Kết chuyển (Nơi tích hợp API của bạn)
    function saveToBank() {
        const rows = document.querySelectorAll('#questionTableBody tr');
        const data = Array.from(rows).map(row => {
            const inputs = row.querySelectorAll('input');
            return {
                cau_hoi: inputs[0].value,
                da_a: inputs[1].value,
                da_b: inputs[2].value,
                da_c: inputs[3].value,
                da_d: inputs[4].value,
                dap_an_dung: inputs[5].value.toUpperCase()
            };
        });

        // TẠI ĐÂY: GỌI HÀM LƯU DỮ LIỆU VÀO SUPABASE CỦA BẠN
        // VD: insertDataToSupabase(data);
        console.log("Dữ liệu cần lưu:", data);
        alert("Thành công! Đã gửi dữ liệu sang bộ xử lý.");
    }
</script>
</body>
</html>
